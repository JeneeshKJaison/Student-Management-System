<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Students - Student Management System</title>
  <link rel="stylesheet" href="students.css">
</head>
<body>
  <nav class="navbar">
    <h2>SMS Students</h2>
    <div class="nav-links">
      <a href="../dashboard/dashboard.html">Dashboard</a>
      <a href="../reports/reports.html">Reports</a>
    </div>
  </nav>

  <main class="content">
    <h3>Student Records</h3>
    <form id="addStudentForm" class="add-form">
      <input type="text" id="fullName" placeholder="Full name" required>
      <input type="text" id="rollNo" placeholder="Roll No" required>
      <input type="text" id="course" placeholder="Course">
      <input type="email" id="email" placeholder="Email">
      <button type="submit">Add Student</button>
    </form>

    <table id="studentsTable">
      <thead>
        <tr><th>Name</th><th>Roll No</th><th>Course</th><th>Email</th><th>Enrolled On</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script src="students.js"></script>
</body>
</html>
